name: Build and release module

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-binary:
    name: Build Net-SNMP for ${{ matrix.platform_key }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            platform_key: linux-x64
            runner: ubuntu-latest
          - platform: linux/arm64
            platform_key: linux-arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout module
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build portable Net-SNMP bundle
        uses: docker/build-push-action@v6
        with:
          context: build/net-snmp
          file: build/net-snmp/Dockerfile
          platforms: ${{ matrix.platform }}
          target: export
          outputs: type=local,dest=build-output
          cache-from: type=gha,scope=net-snmp-${{ matrix.platform_key }}
          cache-to: type=gha,mode=max,scope=net-snmp-${{ matrix.platform_key }}

      - name: Prepare module binaries
        run: |
          set -euo pipefail
          install -d "artifact/bin/${{ matrix.platform_key }}"
          cp -a build-output/. "artifact/bin/${{ matrix.platform_key }}/"
          test -x "artifact/bin/${{ matrix.platform_key }}/snmpget"
          test -x "artifact/bin/${{ matrix.platform_key }}/snmpwalk"

      - name: Verify bundle in Debian
        run: |
          set -euo pipefail
          for command in snmpget snmpwalk; do
            docker run --rm \
              --platform "${{ matrix.platform }}" \
              --volume "$PWD/artifact:/module:ro" \
              debian:bookworm-slim \
              "/module/bin/${{ matrix.platform_key }}/$command" --version
          done

      - name: Upload platform binaries
        uses: actions/upload-artifact@v4
        with:
          name: ups-monitor-${{ matrix.platform_key }}
          path: artifact
          if-no-files-found: error

  package:
    name: Package module
    needs: build-binary
    runs-on: ubuntu-latest

    steps:
      - name: Checkout module
        uses: actions/checkout@v4

      - name: Download platform binaries
        uses: actions/download-artifact@v4
        with:
          pattern: ups-monitor-linux-*
          path: .
          merge-multiple: true

      - name: Package module ZIP
        run: node scripts/package.mjs

      - name: Upload module package
        uses: actions/upload-artifact@v4
        with:
          name: ups-monitor-module
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download module package
        uses: actions/download-artifact@v4
        with:
          name: ups-monitor-module
          path: dist

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" dist/* --clobber
          else
            gh release create "${GITHUB_REF_NAME}" dist/* --generate-notes --verify-tag
          fi
